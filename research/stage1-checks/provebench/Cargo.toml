[package]
name = "provebench"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "provebench"
path = "src/main.rs"

[dependencies]
orchard = { version = "0.15.5", default-features = false, features = ["circuit", "multicore"] }
rand = "0.8"
rand_chacha = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-rayon = "1.3"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
