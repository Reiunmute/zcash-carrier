# Multithreaded wasm build of the whole sale self-test (carrier-sale::selftest), for Chromium.
# Build: see README in this directory's parent (RESULTS.md, P7 section) or run.sh.
[package]
name = "salebench"
version = "0.0.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
carrier-sale = { path = "../../../crates/carrier-sale" }
orchard = { version = "0.15.5", default-features = false, features = ["std", "circuit", "multicore"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-rayon = "1.3"
getrandom = { version = "0.2", features = ["js"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 3
