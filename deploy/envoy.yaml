# grpc-web and gRPC in front of lightwalletd. Only the CompactTxStreamer service is routed.
# CORS allows any origin: the data is public chain data, and the site is cross-origin isolated.
# ponytail: one global token bucket, not per client; add per-IP limits before heavy public use.
static_resources:
  listeners:
    - name: lwd
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: lwd
                codec_type: AUTO
                stream_idle_timeout: 300s
                route_config:
                  name: lwd
                  virtual_hosts:
                    - name: lwd
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/cash.z.wallet.sdk.rpc.CompactTxStreamer/" }
                          route:
                            cluster: lightwalletd
                            timeout: 0s
                            max_stream_duration: { grpc_timeout_header_max: 0s }
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match: [{ safe_regex: { regex: ".*" } }]
                          allow_methods: "POST, OPTIONS"
                          allow_headers: "content-type, x-grpc-web, x-user-agent, grpc-timeout"
                          expose_headers: "grpc-status, grpc-message"
                          max_age: "86400"
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: lwd_rate
                      token_bucket: { max_tokens: 200, tokens_per_fill: 100, fill_interval: 1s }
                      filter_enabled:
                        default_value: { numerator: 100, denominator: HUNDRED }
                      filter_enforced:
                        default_value: { numerator: 100, denominator: HUNDRED }
                  - name: envoy.filters.http.cors
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors }
                  - name: envoy.filters.http.grpc_web
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb }
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
  clusters:
    - name: lightwalletd
      type: STRICT_DNS
      connect_timeout: 5s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: lightwalletd
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: lightwalletd, port_value: 9067 }
