[package]
name = "carrier-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen exports of carrier-core for the browser marketplace."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
carrier-core = { path = "../carrier-core" }
wasm-bindgen = "=0.2.129"
serde_json = "1"
hex = "0.4"
carrier-sale = { path = "../carrier-sale", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[features]
# The PCZT sale path. Needs a wasm-capable C compiler for secp256k1-sys (see carrier-sale).
sale = ["dep:carrier-sale", "dep:rand_core"]
