[package]
name = "carrier-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen exports of carrier-core for the browser marketplace."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
carrier-core = { path = "../carrier-core" }
wasm-bindgen = "=0.2.129"
serde_json = "1"
hex = "0.4"
carrier-sale = { path = "../carrier-sale", optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }
anyhow = "1"
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
zcash_primitives = { version = "0.30.1", default-features = false, optional = true }
zcash_protocol = { version = "0.10.6", optional = true }

[features]
# The PCZT sale path and the browser verifier (tx parsing). Needs a wasm-capable C compiler for
# secp256k1-sys (see carrier-sale).
sale = ["dep:carrier-sale", "dep:js-sys", "dep:wasm-bindgen-futures", "dep:zcash_primitives", "dep:zcash_protocol"]
