[package]
name = "orderbook"
version = "0.1.0"
edition = "2021"
description = "Stage 1 order book (marketplace SPEC 2, 3.1, 3.2): public listings, intents and opaque ciphertext only."

[dependencies]
carrier = { path = "../.." }
carrier-core = { path = "../carrier-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
blake2b_simd = "1"
