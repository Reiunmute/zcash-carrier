[workspace]
members = [".", "crates/carrier-core", "crates/carrier-sale", "crates/carrier-wasm", "crates/orderbook"]

[package]
name = "carrier"
version = "0.1.0"
edition = "2021"

[dependencies]
carrier-core = { path = "crates/carrier-core" }
carrier-sale = { path = "crates/carrier-sale" }
orchard = "0.15.5"
zcash_primitives = "0.30.1"
zcash_protocol = "0.10.6"
zcash_transparent = "0.10.0"
zcash_note_encryption = "0.4"
zcash_address = "0.13"
zcash_client_backend = { version = "0.24.0", features = ["lightwalletd-tonic", "orchard"] }
sapling = { package = "sapling-crypto", version = "0.7", features = ["test-dependencies"] }
incrementalmerkletree = "0.8"
zip32 = "0.2"
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
anyhow = "1"
pasta_curves = { version = "0.5.2", features = ["alloc"] }
group = "0.13"
blake2b_simd = "1"
pczt = { version = "0.9.3", features = ["zcp-builder", "io-finalizer", "prover", "signer", "tx-extractor"] }

[profile.release]
opt-level = 3

[dev-dependencies]
prost = "0.14"
