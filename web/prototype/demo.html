<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zarrier demo: one sale, both sides</title>
<link rel="stylesheet" href="styles.css?v=5">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .bar { border-bottom: 1px solid var(--ink); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; }
  .bar h1 { font-size: 18px; font-weight: 400; margin: 0; }
  .bar .legend { flex: 1 1 320px; font-size: 12px; line-height: 1.5; color: var(--mute); margin: 0; }
  .bar .ctl { display: flex; gap: 8px; flex-wrap: wrap; }
  .bar .ctl .btn { height: 36px; padding: 0 12px; font-size: 14px; }
  .bar .ctl .btn[aria-pressed="true"] { background: var(--mid); }
  .panes { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .panes[data-show="seller"] { grid-template-columns: 1fr; }
  .panes[data-show="seller"] .pane.buyer, .panes[data-show="buyer"] .pane.seller { display: none; }
  .panes[data-show="buyer"] { grid-template-columns: 1fr; }
  .pane { display: grid; grid-template-rows: 32px 1fr; min-width: 0; min-height: 0; }
  .pane + .pane { border-left: 1px solid var(--ink); }
  .pane .label { background: var(--mid); border-bottom: 1px solid var(--ink); display: flex; align-items: center; padding: 0 12px; }
  .pane.buyer .label { background: var(--light); }
  iframe { border: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="bar">
  <h1>Zarrier demo: one sale, both sides</h1>
  <p class="legend">Real: the "holds it" checks (R1 to R3 in wasm on testnet data). Simulated: wallet, deposit, proving, broadcast, mining; nothing is sent. Try: the seller lists Masks, sealed #1; the buyer buys it.</p>
  <div class="ctl">
    <button class="btn" data-show="both" aria-pressed="true">Both</button>
    <button class="btn" data-show="seller" aria-pressed="false">Seller</button>
    <button class="btn" data-show="buyer" aria-pressed="false">Buyer</button>
    <a class="btn" href="index.html?as=seller#/account" target="zarrier-seller">Seller window</a>
    <a class="btn" href="index.html?as=buyer#/" target="zarrier-buyer">Buyer window</a>
    <button class="btn" id="reset">Reset demo</button>
  </div>
</div>
<div class="panes" id="panes" data-show="both">
  <section class="pane seller"><div class="label meta">Seller's browser</div><iframe id="seller" title="Seller" src="index.html?as=seller&v=5#/account"></iframe></section>
  <section class="pane buyer"><div class="label meta">Buyer's browser</div><iframe id="buyer" title="Buyer" src="index.html?as=buyer&v=5#/"></iframe></section>
</div>
<script>
// Narrow screens start with one side; "Seller window" and "Buyer window" open each side in its own
// browser window (they stay in sync through local storage, like two people on one site).
const panes = document.getElementById('panes');
const show = (v) => { panes.dataset.show = v; document.querySelectorAll('[data-show]').forEach((b) => b.tagName === 'BUTTON' && b.setAttribute('aria-pressed', String(b.dataset.show === v))); };
document.querySelectorAll('button[data-show]').forEach((b) => b.addEventListener('click', () => show(b.dataset.show)));
if (innerWidth < 1100) show('seller');
document.getElementById('reset').addEventListener('click', () => {
  localStorage.removeItem('zarrier-demo-v1');
  for (const id of ['seller', 'buyer']) document.getElementById(id).contentWindow.location.reload();
});
</script>
</body>
</html>
